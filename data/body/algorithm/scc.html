<p>SCC는 방향 그래프에서 임의의 두 정점 u, v에 대해 u→v, v→u가 모두 가능한 최대 정점 집합이다.</p>
          <h3>왜 중요한가?</h3>
          <ul>
            <li>그래프를 SCC 단위로 압축하면 DAG가 된다.</li>
            <li>사이클 처리, 위상 정렬 전처리, 2-SAT에서 핵심이다.</li>
          </ul>
          <h3>대표 알고리즘</h3>
          <ul>
            <li>Kosaraju: 정방향 DFS + 역방향 DFS</li>
            <li>Tarjan: DFS 한 번으로 SCC 추출 (stack + low-link)</li>
          </ul>
          <h3>복잡도</h3>
          <p>두 방법 모두 인접 리스트 기준 <code>O(V + E)</code></p>
