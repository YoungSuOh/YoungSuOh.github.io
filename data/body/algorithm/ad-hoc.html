<p>Ad Hoc 문제는 특정 알고리즘 공식보다 관찰과 구현 정확도가 더 중요한 문제군이다.</p>
          <h3>접근 순서</h3>
          <ol>
            <li>문제 조건을 작은 규칙 단위로 분해</li>
            <li>예외 케이스(경계값)를 먼저 정리</li>
            <li>테스트 입력을 손으로 시뮬레이션</li>
            <li>코드를 최대한 단순하게 유지</li>
          </ol>
          <h3>자주 하는 실수</h3>
          <ul>
            <li>조건 누락 (특히 같음/비었음)</li>
            <li>인덱스 경계 오류</li>
            <li>문제에서 요구하는 출력 형식 불일치</li>
          </ul>
